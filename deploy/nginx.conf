# ============================================================
# nginx 站点配置：前端静态文件 + /api 反向代理（SSE 流式）
# 挂载到 /etc/nginx/conf.d/default.conf
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（带 hash 的 assets 长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存：前端发版后用户刷新即可拿到最新入口（JS/CSS 带 hash 已长缓存）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 图片等静态资源
    location ~* \.(jpg|jpeg|png|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── API 反向代理 ──
    # 关键：SSE 流式输出必须关闭 proxy_buffering，
    # 否则回答会攒到最后一次性吐出，前端看不到"打字机"效果
    location /api/ {
        proxy_pass http://backend:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键配置：关缓冲、关 gzip、长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;

        add_header X-Accel-Buffering no;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}
